name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - client
    paths:
      - "desktop-client/**"
      - ".github/workflows/build-windows-release.yml"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        working-directory: desktop-client
        run: python -m pip install --upgrade pip pillow

      - name: Build Windows installer
        working-directory: desktop-client
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\packaging\windows\build_windows_installer.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BXB_Client_Setup_Windows
          path: desktop-client/dist/windows-installer/BXB_Client_Setup_Windows.exe

      - name: Upload release asset
        if: github.ref == 'refs/heads/client'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: gh release upload bxb-client-v1.0.0 .\desktop-client\dist\windows-installer\BXB_Client_Setup_Windows.exe --clobber --repo ${{ github.repository }}
