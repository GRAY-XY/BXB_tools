name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - client
    paths:
      - "UI/banxuebang_flutter/**"
      - "desktop-shell/**"
      - "src/**"
      - "docs/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows-release.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter Windows desktop
        working-directory: UI/banxuebang_flutter
        shell: powershell
        run: flutter config --enable-windows-desktop

      - name: Build Windows installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\UI\banxuebang_flutter\packaging\windows\build_windows_installer.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BXB_Student_Windows_Installer
          path: |
            dist/banxuebang-flutter-release-*/BXB_Student_Windows_v*_Setup.exe
            dist/banxuebang-flutter-release-*/BXB_Student_Windows_v*.zip
