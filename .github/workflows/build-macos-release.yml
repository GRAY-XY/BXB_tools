name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing macOS GitHub release tag to receive the macOS packages
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-package:
    runs-on: macos-14

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/macos/package-lock.json

      - name: Confirm the GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release view "$RELEASE_TAG" >/dev/null

      - name: Install root and macOS app dependencies
        run: |
          npm ci
          npm ci --prefix apps/macos

      - name: Build and checksum macOS packages
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash ./release/scripts/build-macos-release.sh "$RELEASE_TAG"

      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          files=(release/artifacts/macos/*.dmg release/artifacts/macos/*.dmg.sha256)
          if (( ${#files[@]} == 0 )); then
            echo "No macOS release files were found." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
