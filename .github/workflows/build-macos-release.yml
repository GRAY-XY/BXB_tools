name: Build macOS Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and upload
        required: true
        default: v1.3.0

permissions:
  contents: write

jobs:
  macos-package:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          raw="$(grep '^version:' UI/banxuebang_flutter/pubspec.yaml | awk '{print $2}')"
          version="${raw%%+*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter macOS desktop
        working-directory: UI/banxuebang_flutter
        run: flutter config --enable-macos-desktop

      - name: Build Flutter release app
        working-directory: UI/banxuebang_flutter
        run: flutter build macos --release

      - name: Bundle runtime into app
        run: |
          chmod +x ./UI/banxuebang_flutter/packaging/macos/build_macos_pkg.sh
          ./UI/banxuebang_flutter/packaging/macos/build_macos_pkg.sh

      - name: Build main DMG
        id: dmg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          APP_PATH="$(ls -d dist/banxuebang-flutter-release-*/BXB\ Student.app | head -n1)"
          DMG_NAME="BXB_Student_macOS_v${VERSION}.dmg"
          DMG_PATH="dist/${DMG_NAME}"
          mkdir -p dist

          hdiutil create \
            -volname "BXB Student" \
            -srcfolder "$APP_PATH" \
            -ov -format UDRW \
            "dist/tmp_bxb.dmg"

          hdiutil convert "dist/tmp_bxb.dmg" \
            -format UDZO \
            -o "$DMG_PATH"

          rm -f "dist/tmp_bxb.dmg"

          SHA256="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "DMG: $DMG_PATH  SHA256: $SHA256"

      - name: Build installer .app and DMG
        id: installer
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          DMG_URL="https://github.com/GRAY-XY/BXB_tools/releases/download/${TAG}/BXB_Student_macOS_v${VERSION}.dmg"
          INSTALLER_OUT="dist/installer"
          INSTALLER_NAME="安装 BXB Student v${VERSION}"
          INSTALLER_DMG_NAME="BXB_Student_macOS_Installer_v${VERSION}.dmg"
          INSTALLER_DMG_PATH="dist/${INSTALLER_DMG_NAME}"

          chmod +x ./UI/banxuebang_flutter/packaging/macos/build_installer_app.sh
          ./UI/banxuebang_flutter/packaging/macos/build_installer_app.sh \
            "$VERSION" \
            "$DMG_URL" \
            "$INSTALLER_OUT"

          # 把安装器 .app 打成独立 DMG
          INSTALLER_APP="$INSTALLER_OUT/安装 BXB Student.app"
          hdiutil create \
            -volname "$INSTALLER_NAME" \
            -srcfolder "$INSTALLER_APP" \
            -ov -format UDRW \
            "dist/tmp_installer.dmg"

          hdiutil convert "dist/tmp_installer.dmg" \
            -format UDZO \
            -o "$INSTALLER_DMG_PATH"

          rm -f "dist/tmp_installer.dmg"

          echo "installer_dmg_path=$INSTALLER_DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "installer_dmg_name=$INSTALLER_DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "Installer DMG: $INSTALLER_DMG_PATH"

      - name: Resolve PKG path
        id: pkg
        run: |
          pkg_path="$(ls -1 dist/banxuebang-flutter-release-*/BXB_Student_macOS_v*.pkg 2>/dev/null | head -n1 || echo '')"
          echo "pkg_path=$pkg_path" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BXB_Student_macOS_Artifacts
          path: |
            ${{ steps.dmg.outputs.dmg_path }}
            ${{ steps.installer.outputs.installer_dmg_path }}

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "BXB Student v${VERSION}" \
              --notes "macOS 桌面版 v${VERSION}" \
              --prerelease
          fi

      - name: Attach files to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release upload "$TAG" "${{ steps.dmg.outputs.dmg_path }}" --clobber
          gh release upload "$TAG" "${{ steps.installer.outputs.installer_dmg_path }}" --clobber
          if [ -n "${{ steps.pkg.outputs.pkg_path }}" ]; then
            gh release upload "$TAG" "${{ steps.pkg.outputs.pkg_path }}" --clobber
          fi

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
          INSTALLER_DMG_NAME: ${{ steps.installer.outputs.installer_dmg_name }}
          DMG_NAME: ${{ steps.dmg.outputs.dmg_name }}
        run: |
          NOTES="## BXB Student v${VERSION}

          ### 📦 安装方法（推荐，双击即可）

          1. 下载 \`${INSTALLER_DMG_NAME}\`
          2. 打开 DMG，双击「安装 BXB Student」
          3. 按提示完成安装，全程无需终端

          ### 🔧 高级用户 / 手动安装

          下载 \`${DMG_NAME}\`，拖入「应用程序」文件夹，然后运行：
          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/BXB\ Student.app
          \`\`\`

          ### 🍺 Homebrew（开发者）

          \`\`\`bash
          brew tap igpig1226/tap
          brew install --cask bxb-student
          \`\`\`"

          gh release edit "$TAG" --notes "$NOTES"

      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}
          VERSION: ${{ steps.dmg.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
          DMG_NAME: ${{ steps.dmg.outputs.dmg_name }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          CASK_CONTENT="cask \"bxb-student\" do
            version \"${VERSION}\"
            sha256 \"${SHA256}\"

            url \"https://github.com/GRAY-XY/BXB_tools/releases/download/${TAG}/${DMG_NAME}\"
            name \"BXB Student\"
            desc \"班学帮学生桌面工具\"
            homepage \"https://github.com/GRAY-XY/BXB_tools\"

            app \"BXB Student.app\"

            postflight do
              system_command \"/usr/bin/xattr\",
                             args: [\"-dr\", \"com.apple.quarantine\", \"#{appdir}/BXB Student.app\"]
            end

            uninstall quit: \"com.grayxy.bxbstudent\",
                      delete: \"#{appdir}/BXB Student.app\"

            zap trash: [
              \"~/Library/Application Support/BXB Student\",
              \"~/Library/Logs/BXB Student\",
            ]
          end
          "

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          TAP_REPO="https://x-access-token:${GH_TOKEN}@github.com/igpig1226/homebrew-tap.git"
          if git ls-remote "$TAP_REPO" HEAD >/dev/null 2>&1; then
            git clone "$TAP_REPO" homebrew-tap-repo
            mkdir -p homebrew-tap-repo/Casks
            echo "$CASK_CONTENT" > homebrew-tap-repo/Casks/bxb-student.rb
            cd homebrew-tap-repo
            git add Casks/bxb-student.rb
            git diff --cached --quiet || git commit -m "chore: update bxb-student to v${VERSION}"
            git push
            cd ..
            echo "Cask updated."
          fi
